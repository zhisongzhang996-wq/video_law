<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>视频上传 · 法条智能匹配</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <style>
    /* ======================= 设计系统（可按需改色） ======================= */
    :root {
      --brand: #5b8cff;              /* 品牌主色 */
      --brand-2: #7b61ff;            /* 渐变第二色 */
      --ok: #0e9f6e;
      --warn: #eab308;
      --danger: #ef4444;

      /* 浅色模式变量 */
      --bg: #f6f7fb;
      --text: #111827;
      --muted: #6b7280;
      --card: rgba(255,255,255,0.7);
      --card-border: rgba(17,24,39,0.08);
      --chip-bg: #f3f4f6;
      --chip-text: #111827;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d14;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --card: rgba(17,24,39,0.65);
        --card-border: rgba(255,255,255,0.06);
        --chip-bg: rgba(255,255,255,0.06);
        --chip-text: #e5e7eb;
      }
    }

    /* ======================= 全局与背景 ======================= */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font: 15px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(123,97,255,0.25), transparent 60%),
        radial-gradient(1200px 600px at -10% 10%, rgba(91,140,255,0.25), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0) 40%),
        var(--bg);
    }

    .container { max-width: 1080px; padding: 32px 20px 48px; margin: 0 auto; }

    /* ======================= 顶部导航 ======================= */
    .nav {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
    }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: conic-gradient(from 120deg, var(--brand), var(--brand-2));
      box-shadow: 0 10px 30px rgba(123,97,255,0.25), inset 0 -1px 0 rgba(255,255,255,0.3);
    }
    .brand h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    .brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .nav .actions { display:flex; align-items:center; gap:10px; }
    .btn-ghost { border:1px solid var(--card-border); background: transparent; color: var(--text); }

    /* ======================= 卡片（毛玻璃 + 渐变描边） ======================= */
    .card {
      position: relative; border-radius: 16px; padding: 20px; margin-top: 16px;
      background: var(--card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .card .card-title { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
    .card h3 { margin: 0; font-size: 16px; }

    /* ======================= 栅格 ======================= */
    .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    /* ======================= 上传区域（Drag & Drop） ======================= */
    .dropzone { border: 1px dashed var(--card-border); border-radius: 14px; padding: 18px; text-align: center; transition: .2s ease;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
    }
    .dropzone.hover { border-color: var(--brand); box-shadow: 0 8px 24px rgba(91,140,255,0.18); transform: translateY(-1px); }
    .dropzone input[type=file] { display: none; }
    .dz-title { font-weight: 600; }
    .dz-sub { font-size: 13px; color: var(--muted); }

    /* ======================= 组件：按钮 / 开关片 ======================= */
    .btn { padding: 10px 14px; border: 0; border-radius: 10px; color: #fff; cursor: pointer; font-weight: 600;
      background-image: linear-gradient(90deg, var(--brand), var(--brand-2));
      box-shadow: 0 8px 24px rgba(91,140,255,0.35); transition: transform .08s ease, box-shadow .2s ease; }
    .btn:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(91,140,255,0.42); }
    .btn.secondary { background: #111827; color:#fff; box-shadow: none; border:1px solid var(--card-border); }

    .toolbar { display:flex; align-items:center; gap:10px; flex-wrap: wrap; }

    .chips { display:flex; gap:8px; flex-wrap: wrap; }
    .chip { border:1px solid var(--card-border); background: var(--chip-bg); color: var(--chip-text); padding:8px 10px; border-radius: 9999px; font-size: 13px; cursor:pointer; user-select: none; transition: .2s; }
    .chip:hover { transform: translateY(-1px); }
    .chip-input { display:none; }
    .chip-input:checked + .chip { background-image: linear-gradient(90deg, var(--brand), var(--brand-2)); color:#fff; border-color: transparent; box-shadow: 0 8px 18px rgba(91,140,255,0.35); }

    /* ======================= 进度条 ======================= */
    .progress { height: 10px; border-radius: 999px; background: rgba(0,0,0,0.08); overflow: hidden; margin-top: 10px; display:none; }
    .progress .bar { height: 100%; width: 0%; background-image: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .2s ease; }

    /* ======================= 结果与历史 ======================= */
    .muted { color: var(--muted); font-size: 13px; }
    .statute { padding: 12px; border-radius: 12px; border:1px solid var(--card-border); background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent); margin: 10px 0; }
    .pill { display:inline-block; padding: 2px 8px; border-radius:9999px; font-size: 12px; margin-right:6px; background: rgba(123,97,255,0.12); color: #5b8cff; }

    /* ======================= 视频预览 ======================= */
    .preview { display:none; margin-top: 12px; }
    .preview video { width: 100%; border-radius: 12px; border:1px solid var(--card-border); }

    /* ======================= Toast ======================= */
    .toast { position: fixed; right: 18px; bottom: 18px; display:none; background: var(--card); backdrop-filter: blur(8px); border:1px solid var(--card-border); padding: 12px 14px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); }

    /* ======================= Skeleton ======================= */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.22), rgba(255,255,255,0.06)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 10px; }
    @keyframes shimmer { 0%{background-position: 200% 0;} 100%{background-position: -200% 0;} }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部栏 -->
    <div class="nav">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>视频上传 · 法条智能匹配</h1>
          <div class="sub">更优雅的交互、更专业的呈现</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-ghost btn secondary" id="refreshBtn" type="button">刷新历史</button>
      </div>
    </div>

    <!-- 主体栅格：左上传/右结果 -->
    <div class="grid">
      <!-- 左侧：上传与类型选择 -->
      <div class="card">
        <div class="card-title">
          <h3>① 上传视频 & 选择类型</h3>
          <div class="toolbar">
            <button class="btn" id="toggleAllBtn" type="button">全选 / 取消</button>
          </div>
        </div>

        <label class="dropzone" id="dropzone">
          <input type="file" id="video" accept="video/*" />
          <div class="dz-title">拖拽视频到此 / 点击选择文件</div>
          <div class="dz-sub">仅支持 video/* 类型，单次 1 个文件</div>
        </label>

        <div class="preview" id="preview">
          <video id="previewVideo" controls preload="metadata"></video>
          <div class="muted" id="previewMeta" style="margin-top:6px;"></div>
        </div>

        <div style="margin-top: 14px;">
          <div class="muted" style="margin-bottom: 8px;">勾选视频所属类型（可多选）：</div>
          <div id="typesBox" class="chips">
            <div class="skeleton" style="height:34px;width:88px;"></div>
            <div class="skeleton" style="height:34px;width:96px;"></div>
            <div class="skeleton" style="height:34px;width:120px;"></div>
          </div>
        </div>

        <div style="margin-top: 16px; display:flex; gap:10px; align-items:center;">
          <button class="btn" id="submitBtn" type="button">上传并匹配法条</button>
          <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
        </div>
        <div class="muted" id="typesTip" style="margin-top:8px;">提示：所选类型会与后端 statutes.category 匹配，返回相应法条。</div>
      </div>

      <!-- 右侧：匹配结果 -->
      <div class="card" id="resultCard">
        <div class="card-title"><h3>② 匹配结果</h3></div>
        <div class="muted">上传后将在此显示匹配到的法条列表。</div>
      </div>
    </div>

    <!-- 下方：最近上传 -->
    <div class="card">
      <div class="card-title">
        <h3>最近上传</h3>
        <div class="muted">用于演示/排查。生产可关闭。</div>
      </div>
      <div id="history" class="muted">加载中…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ==================== 配置：前后端同源/分离 ====================
  // 同源部署：将 API_BASE 设为 ''（空字符串）
  // 分离部署：将其改为你的后端地址，如 'https://api.example.com'
  const API_BASE = 'https://blink-organizing-sum-smallest.trycloudflare.com';

  const FALLBACK_TYPES = ['校园暴力','交通安全','网络侵权','环境保护','公共安全'];

  // ==================== 小工具函数 ====================
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function showToast(msg, ms = 2200) {
    const el = $('#toast');
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.style.display = 'none', ms);
  }

  function formatBytes(bytes) {
    if (!bytes && bytes !== 0) return '';
    const kb = bytes/1024, mb = kb/1024; return mb >= 1 ? mb.toFixed(2) + ' MB' : kb.toFixed(1) + ' KB';
  }

  // ==================== 渲染类型（芯片风格复选） ====================
  function renderTypes(list, warnMsg = '') {
    const box = $('#typesBox');
    box.innerHTML = '';
    (list || []).forEach(t => {
      const id = 'chk_' + t;
      const input = document.createElement('input'); input.type = 'checkbox'; input.id = id; input.value = t; input.name = 'types'; input.className = 'chip-input';
      const label = document.createElement('label'); label.className = 'chip'; label.htmlFor = id; label.textContent = t;
      const wrap = document.createElement('div'); wrap.appendChild(input); wrap.appendChild(label); box.appendChild(wrap);
    });
    const tip = $('#typesTip');
    if (warnMsg) { tip.style.color = '#b00020'; tip.textContent = warnMsg; } else { tip.style.color = ''; tip.textContent = '提示：所选类型会与后端 statutes.category 匹配，返回相应法条。'; }
  }

  async function fetchTypes() {
    try {
      const res = await fetch(`${API_BASE}/api/types`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const types = Array.isArray(data.types) && data.types.length ? data.types : FALLBACK_TYPES;
      const warn = (Array.isArray(data.types) && data.types.length) ? '' : '未从后端获取到类型，已使用本地兜底。';
      renderTypes(types, warn);
    } catch (e) {
      renderTypes(FALLBACK_TYPES, `加载类型失败：${e.message}（已使用本地兜底）`);
    }
  }

  // 全选 / 取消全选
  $('#toggleAllBtn').addEventListener('click', () => {
    const checks = $$('input[name="types"]');
    const allChecked = checks.length>0 && checks.every(c => c.checked);
    checks.forEach(c => (c.checked = !allChecked));
  });

  // ==================== 最近上传 ====================
  async function refreshHistory() {
    try {
      const res = await fetch(`${API_BASE}/api/videos`);
      const data = await res.json();
      const box = $('#history');
      if (!data.ok || !data.items || data.items.length === 0) { box.textContent = '暂无数据'; return; }
      box.innerHTML = '';
      data.items.forEach(v => {
        const div = document.createElement('div');
        div.className = 'statute';
        div.innerHTML = `
          <div><strong>#${v.id}</strong> ${v.original_name}</div>
          <div class="muted">文件名：${v.filename} ｜ 大小：${formatBytes(v.size_bytes)} ｜ 上传时间：${v.uploaded_at}</div>
          <div>类型：${String(v.types||'').split(',').filter(Boolean).map(t=>`<span class="pill">${t}</span>`).join('')}</div>
        `;
        box.appendChild(div);
      });
    } catch (e) { $('#history').textContent = '加载失败（控制台查看详细）'; console.warn('加载历史失败：', e); }
  }

  // ==================== 上传逻辑（含进度与预览） ====================
  const dropzone = $('#dropzone'); const fileInput = $('#video');
  ;['dragenter','dragover'].forEach(ev => dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.classList.add('hover'); }));
  ;['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.classList.remove('hover'); }));
  dropzone.addEventListener('click', ()=> fileInput.click());
  dropzone.addEventListener('drop', e => { const f = e.dataTransfer.files?.[0]; if (f) { fileInput.files = e.dataTransfer.files; handleSelectedFile(f); } });
  fileInput.addEventListener('change', () => { const f = fileInput.files?.[0]; if (f) handleSelectedFile(f); });

  function handleSelectedFile(file) {
    if (!file.type.startsWith('video/')) { showToast('请选择视频文件'); return; }
    const url = URL.createObjectURL(file);
    const video = $('#previewVideo'); video.src = url; $('#preview').style.display = 'block';
    video.addEventListener('loadedmetadata', () => {
      const meta = `${Math.round(video.duration)}s · ${video.videoWidth}×${video.videoHeight} · ${formatBytes(file.size)}`;
      $('#previewMeta').textContent = meta;
    }, { once: true });
  }

  async function uploadWithProgress(formData) {
    // 使用 XHR 以支持进度条（fetch 对上传进度支持不佳）
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `${API_BASE}/api/upload`, true);
      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const p = Math.round((e.loaded / e.total) * 100);
        $('#progress').style.display = 'block'; $('#bar').style.width = p + '%';
      };
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4) {
          try { resolve(JSON.parse(xhr.responseText || '{}')); } catch (err) { reject(err); }
        }
      };
      xhr.onerror = reject;
      xhr.send(formData);
    });
  }

  $('#submitBtn').addEventListener('click', async () => {
    const btn = $('#submitBtn');
    try {
      const file = fileInput.files?.[0]; if (!file) throw new Error('请先选择视频文件');
      const selected = $$('input[name="types"]:checked').map(i => i.value);
      if (selected.length === 0) throw new Error('请至少勾选一个类型');

      const fd = new FormData(); fd.append('video', file); fd.append('types', selected.join(','));
      btn.disabled = true; btn.textContent = '上传中…';

      const data = await uploadWithProgress(fd);

      const card = $('#resultCard');
      if (!data.ok) {
        card.innerHTML = `<div class="card-title"><h3>② 匹配结果</h3></div><div style="color:#b00020;">上传失败：${data.msg || '未知错误'}</div>`;
        showToast('上传失败');
        return;
      }

      const ms = data.matched_statutes || [];
      const tags = (data.video?.types || []).map(t => `<span class="pill">${t}</span>`).join('');
      card.innerHTML = `
        <div class="card-title"><h3>② 匹配结果</h3></div>
        <div class="muted">视频ID：${data.video.id} ｜ 原文件：${data.video.original_name} ｜ 大小：${(data.video.size_bytes/1024/1024).toFixed(2)} MB</div>
        <div style="margin:8px 0;">选择类型：${tags}</div>
        <h4 style="margin: 10px 0;">匹配到的法条（${ms.length}）</h4>
        ${ms.length === 0 ? '<div class="muted">未匹配到法条，请完善数据库。</div>' : ms.map(s => `
          <div class="statute">
            <div><strong>[${s.category}] ${s.law_name}</strong> — ${s.article}</div>
            <div>${s.content}</div>
          </div>
        `).join('')}
      `;

      showToast('上传成功 ✅');
      refreshHistory();
    } catch (err) {
      showToast(err.message || '操作失败');
      const card = $('#resultCard');
      card.innerHTML = `<div class="card-title"><h3>② 匹配结果</h3></div><div style="color:#b00020;">错误：${err.message}</div>`;
    } finally {
      $('#progress').style.display = 'none'; $('#bar').style.width = '0%';
      btn.disabled = false; btn.textContent = '上传并匹配法条';
    }
  });

  // ==================== 首次加载 ====================
  fetchTypes();
  refreshHistory();
</script>
</body>
</html>
